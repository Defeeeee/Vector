name: Deploy web

# **Se despliega cuando el CI de `main` pasa, no cuando llega el push.**
#
# Antes el deploy corría en cada push, en paralelo con el CI y sin mirarlo. El
# 2026-09-22 entraron once commits seguidos con el CI en rojo —tests, tipos y el
# smoke rotos— y los once llegaron a producción igual. Ahora un commit que no pasa
# `tsc`, los tests, el build y el smoke con sesión no se despliega.
#
# `workflow_dispatch` sigue para desplegar a mano (por ejemplo, para reintentar un
# deploy que falló por la red del VPS) sin esperar otra corrida del CI.
on:
  workflow_run:
    workflows: [CI web]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  desplegar:
    # Sólo el CI de `main` que terminó en verde: el de un push, o el que pide `aip.yml`
    # después de commitear el AIP nuevo. Un CI cancelado —porque
    # llegó otro push y lo reemplazó— no despliega: lo hace la corrida nueva.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            # PM2 arranca este proceso con `start -- -p 3010`, y en este server
            # hay cinco Next escuchando en 3000..3003 y 3010. La variable existe
            # para poder moverlo sin tocar el workflow, pero el default es el
            # puerto real, no uno teórico.
            APP_PORT="${{ vars.FRONTEND_PORT || '3010' }}"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Un clon del monorepo sólo para la web (sparse: `apps/web` y `apps/extension`).
            # La API tiene el suyo, `~/Vector/api`: con un clon compartido, el
            # `reset --hard` de acá le cambiaría el código a la API corriendo.
            cd ~/Vector/web/apps/web

            # **Lugar en disco antes de tocar nada.** El 2026-10-03 el VPS llegó a
            # 1,4 GB libres de 45, y el deploy necesita lugar para `node_modules`, el
            # build nuevo y el anterior guardado al lado. Con menos de 2 GB no se
            # despliega y el sitio sigue con el commit que tiene.
            LIBRE_MB=$(df -Pm . | awk 'NR==2 {print $4}')
            # Un valor que no es número haría fallar el `[ -lt ]` adentro del `if`, y
            # el deploy seguiría como si hubiera lugar.
            case "$LIBRE_MB" in
              ''|*[!0-9]*) echo "No pude leer el espacio libre ('$LIBRE_MB'): no despliego."; exit 1 ;;
            esac
            if [ "$LIBRE_MB" -lt 2048 ]; then
              echo "Sólo ${LIBRE_MB} MB libres en el VPS: no despliego (pido 2048)."
              exit 1
            fi

            ANTERIOR=$(git rev-parse HEAD)
            git fetch origin main
            # El commit que el CI aprobó, no "lo último de main": si entró otro push
            # mientras corría el CI, ése todavía no pasó por el CI. Desde
            # `workflow_dispatch` no hay CI de por medio y va lo último.
            DESTINO="${{ github.event.workflow_run.head_sha || 'origin/main' }}"
            git reset --hard "$DESTINO"
            npm ci --omit=dev --no-audit --no-fund || npm install --no-audit --no-fund

            # **Si algo falla, se vuelve al commit anterior con su build, sin construir.**
            # Hasta el 2026-11-03 un build roto cortaba el script (`set -e`) después de
            # borrar `.next`: Vector quedaba en el commit nuevo, sin build en disco, y
            # el siguiente reinicio lo dejaba caído. Pasó ese día, cuando el VPS no pudo
            # bajar las fuentes de Google. Reconstruir el commit anterior tampoco
            # alcanzaba: un corte de red lo rompe igual. Por eso el build anterior no se
            # borra: se aparta a `.next-anterior` y, si hace falta, vuelve.
            volver() {
              echo "Volviendo a $ANTERIOR, con su build."
              git reset --hard "$ANTERIOR"
              # Las dependencias del commit anterior, si cambiaron. Si falla (sin red),
              # se sigue igual: casi siempre las de ahora le sirven.
              if ! git diff --quiet "$ANTERIOR" "$DESTINO" -- package-lock.json; then
                npm ci --omit=dev --no-audit --no-fund || true
              fi
              if [ -d .next-anterior ]; then
                rm -rf .next && mv .next-anterior .next
              else
                rm -rf .next && npm run build
              fi
              pm2 restart vector-frontend --update-env
              exit 1
            }

            # Un build desde cero, sin el caché de Turbopack, NO es opcional: reusa
            # caché entre builds y el bundle puede seguir sirviendo un valor viejo
            # compilado adentro aunque el código fuente esté correcto. Nos pasó dos
            # veces: una con CSS y otra con un secreto, y la segunda costó una hora y
            # media porque el `git pull` decía "Already up to date" y el build decía
            # "Compiled successfully". Apartarlo hace lo mismo que borrarlo.
            #
            # Deja el sitio sin archivos mientras construye (~40 s). Es el precio de un
            # deploy simple.
            rm -rf .next-anterior
            [ -d .next ] && mv .next .next-anterior
            if ! npm run build; then
              echo "El build falló."
              volver
            fi

            pm2 restart vector-frontend --update-env

            # El check tiene que probar que contesta **Vector**, no que algo
            # contesta. En este server conviven doce apps de PM2: un `curl` a un
            # puerto equivocado devuelve 200 de otra cosa y el rollback nunca se
            # dispara, con lo cual el deploy queda en verde y el sitio roto.
            #
            # /api/airports/search es propio de Vector, no pide sesión y además
            # lee los TSV del disco: si el build no los copió, esto lo agarra.
            for i in $(seq 1 20); do
              if curl -fsS "http://localhost:${APP_PORT}/api/airports/search?q=SADM" \
                   | grep -q '"icao":"SADM"'; then
                echo "Health OK tras ${i}s (Vector respondiendo en ${APP_PORT})"
                rm -rf .next-anterior
                exit 0
              fi
              sleep 1
            done

            echo "El health check falló."
            volver
