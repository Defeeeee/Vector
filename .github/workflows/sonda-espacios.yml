name: Sonda espacios aéreos

# **Una sola vez** (2026-11-03): baja los PDF del AIP que hacen falta para armar el parser de
# los espacios aéreos (las CTR de AD 2.17 de cada aeródromo y las TMA de ENR 2.1) y los deja
# como artefacto, para no pedírselos a ANAC desde la red de Federico. Son los mismos pedidos
# que hace `aip.yml` cada martes, como Vector. Se borra después de usarla.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Las fichas AD 2
        run: AIP_GUARDAR_PDF="$RUNNER_TEMP/aip/ad" npm run build:aip
      - name: ENR 2.1 y 2.2
        run: |
          mkdir -p "$RUNNER_TEMP/aip/enr"
          node --input-type=module - "$RUNNER_TEMP/aip/enr" <<'JS'
          import fs from "node:fs";
          import { UA_VECTOR } from "./scripts/ua-vector.mjs";
          const dir = process.argv[2];
          const BASE = "https://ais.anac.gob.ar";
          const html = await (await fetch(`${BASE}/aip/enr`, { headers: { "User-Agent": UA_VECTOR, "X-Requested-With": "XMLHttpRequest" } })).text();
          fs.writeFileSync(`${dir}/enr.html`, html);
          for (const fila of html.match(/<tr[\s\S]*?<\/tr>/g) ?? []) {
            const texto = fila.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
            const doc = /ENR-2\.[12]\b/.exec(texto);
            const href = /href="([^"]+)"/.exec(fila);
            if (!doc || !href) continue;
            await new Promise((r) => setTimeout(r, 2000));
            const res = await fetch(BASE + href[1], { headers: { "User-Agent": UA_VECTOR } });
            console.log(doc[0], res.status, texto.slice(0, 120));
            if (res.ok) fs.writeFileSync(`${dir}/${doc[0]}-${fs.readdirSync(dir).length}.pdf`, Buffer.from(await res.arrayBuffer()));
          }
          JS
          ls -la "$RUNNER_TEMP/aip/enr"
      - uses: actions/upload-artifact@v4
        with:
          name: aip-espacios
          path: ${{ runner.temp }}/aip
          retention-days: 3
