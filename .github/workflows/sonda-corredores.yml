name: Sonda corredores VFR

# **Una sola vez** (2026-11-03): baja ENR 3.5 (normas de los corredores VFR) y ENR 6.10 (carta
# para vuelos VFR por debajo del TMA BAIRES) del AIP, para modelar los corredores VFR en el Mapa.
# Tres pedidos (el listado y dos PDF), como Vector. Se borra después de usarla.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ENR 3.5 y ENR 6.10
        working-directory: apps/web
        run: |
          mkdir -p ../../out
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import { UA_VECTOR } from "./scripts/ua-vector.mjs";
          const BASE = "https://ais.anac.gob.ar";
          const html = await (await fetch(`${BASE}/aip/enr`, { headers: { "User-Agent": UA_VECTOR, "X-Requested-With": "XMLHttpRequest" } })).text();
          for (const fila of html.match(/<tr[\s\S]*?<\/tr>/g) ?? []) {
            const texto = fila.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
            const doc = /ENR-(3\.5|6\.10)\b/.exec(texto);
            const href = /href="([^"]+)"/.exec(fila);
            if (!doc || !href) continue;
            await new Promise((r) => setTimeout(r, 2000));
            const res = await fetch(BASE + href[1], { headers: { "User-Agent": UA_VECTOR } });
            console.log(doc[0], res.status, texto.slice(0, 120));
            if (res.ok) fs.writeFileSync(`../../out/${doc[0]}.pdf`, Buffer.from(await res.arrayBuffer()));
          }
          JS
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        with:
          name: corredores
          path: out
          retention-days: 3
