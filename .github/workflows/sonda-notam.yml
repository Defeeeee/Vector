name: Sonda NOTAM

# Una prueba de una sola vez (2026-11-03): ¿ANAC deja pedir todos los NOTAM juntos? Hace 3
# pedidos, presentándose como Vector y con pausa entre uno y otro, y guarda lo que contestó
# como artefacto para mirarlo. No escribe nada en el repo. Se borra después de usarla.
on:
  workflow_dispatch:

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tres pedidos a ais.anac.gob.ar
        run: |
          set -u
          UA="Vector/1.0 (bitacora de vuelo; https://vector.fdiaznem.com.ar; prueba unica)"
          mkdir -p sonda
          curl -s -m 20 -A "$UA" -D sonda/1-pagina.headers -o sonda/1-pagina.html -w "pagina: %{http_code} %{size_download} B %{time_total}s\n" https://ais.anac.gob.ar/notam || echo "pagina: sin respuesta"
          sleep 3
          curl -s -m 30 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -H "Content-Type: application/x-www-form-urlencoded" \
            --data "indicador=" -D sonda/2-todos.headers -o sonda/2-todos.json \
            -w "json sin indicador: %{http_code} %{size_download} B %{time_total}s\n" https://ais.anac.gob.ar/notam/json || echo "json sin indicador: sin respuesta"
          sleep 3
          curl -s -m 20 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -H "Content-Type: application/x-www-form-urlencoded" \
            --data "indicador=FDO" -D sonda/3-fdo.headers -o sonda/3-fdo.json \
            -w "json FDO: %{http_code} %{size_download} B %{time_total}s\n" https://ais.anac.gob.ar/notam/json || echo "json FDO: sin respuesta"
          for f in sonda/2-todos.json sonda/3-fdo.json; do
            python3 -c "import json,sys; d=json.load(open('$f')); print('$f', type(d).__name__, len(d) if hasattr(d,'__len__') else '', (sorted({x.get('ad') or x.get('indicador') for x in d if isinstance(x, dict)})[:15] if isinstance(d, list) else list(d)[:10]))" 2>&1 | head -3
          done
          echo "--- en la página: actualización, formularios y rutas"
          grep -o -i -E ".{0,60}(actualiz|ultima|última|vigente|fecha).{0,60}" sonda/1-pagina.html | head -15 || true
          grep -o -E "(action|href|src|url)\s*[:=]\s*[\"'][^\"']*notam[^\"']*[\"']" sonda/1-pagina.html | sort -u | head -20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda-notam
          path: sonda/
          retention-days: 3
