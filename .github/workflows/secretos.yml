name: Secretos

# Los dos repos de antes tuvieron un secreto compartido hardcodeado durante meses, en un
# repositorio público. gitleaks lo habría marcado en el PR que lo introdujo. Corre en
# todo el monorepo, en cada PR y en cada push a main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks necesita el historial para revisar los commits del PR.
          fetch-depth: 0

      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
