name: Secretos

# Los dos repos de antes tuvieron un secreto compartido hardcodeado durante meses, en un
# repositorio público. gitleaks lo habría marcado en el PR que lo introdujo. Corre en
# todo el monorepo, en cada PR y en cada push a main.
#
# Con el CLI y no con `gitleaks-action`: la acción arma el rango como
# `<primer commit del PR>^..HEAD`, y eso falla cuando el PR trae una historia con su
# propia raíz (pasó al unir el backend, 2026-11-02). Acá el rango es base..head: todo
# lo que el PR o el push agregan, merges incluidos.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks necesita el historial para revisar los commits nuevos.
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Buscar secretos
        env:
          DESDE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HASTA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # El primer push de una rama no tiene "antes": se revisa todo.
          if [ -z "$DESDE" ] || [ "$DESDE" = "0000000000000000000000000000000000000000" ]; then
            RANGO="$HASTA"
          else
            RANGO="$DESDE..$HASTA"
          fi
          gitleaks git --redact --no-banner --log-opts="$RANGO" .
